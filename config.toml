version = "1.0.0"

[input.primary]
name = "m_x2"
type = "mouse_button"

[input.primary.method]
click = true

[input.secondary]
name = "m_x1"
type = "mouse_button"

[input.secondary.method]
hold = 2.5

[input.third]
name = "m_x1"
type = "mouse_button"

[input.third.method]
click = true

[behavior]
debounce_time = 0.5
auto_paste_after_transcription = false

[audio]
sample_rate = 16000
channels = 1
chunk_size = 1024
format = "wav"
device = 1
auto_select_device = true
test_device_on_startup = true

[system]
volume_reduction_factor = 0.15
min_volume_percent = 5

[transcription]
language = "de"
whisper_model = "small"
compute_type = "float32"

[spell_check]
enabled = false
auto_correct = false

[logging]
enabled = true
console_level = "INFO"
file_level = "DEBUG"
emoji_enabled = true
file_enabled = true
filename = "logs/mauscribe.log"
suppress_external_logs = false

[dictionary]
enabled = true
auto_add_unknown = false
path = "data/config/custom_dictionary.json"
max_words = 1000
filename = "custom_dictionary.json"

[debug]
enabled = true
level = "DEBUG"
verbose = true

[updates]
enabled = true
check_interval = 86400
check_on_startup = true
auto_install = false
include_prereleases = false

[notifications]
duration = 3000
sound = true
toast = true
show_all = true

[gui]
auto_start = false
window_width = 800
window_height = 600
theme = "default"
show_on_startup = false

[database]
enabled = true
data_directory = ""
audio_format = "wav"
auto_save_recordings = true
auto_save_transcriptions = true
mark_as_training_data = true
retention_days = 30
max_size_mb = 1000
compress_audio = false
backup_before_cleanup = true
