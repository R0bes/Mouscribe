# Mauscribe Konfiguration
# ======================

# Version
version = "1.0.0"

# Input-Konfiguration
[input]
primary = { name = "m_x2", type = "mouse_button", method = { "click" = true } }
secondary = { name = "m_x1", type = "mouse_button", method = { "hold" = 1 } }

# Verhalten
[behavior]
debounce_time = 0.5

# Audio-Einstellungen
[audio]
sample_rate = 16000
channels = 1
chunk_size = 1024
format = "wav"
device = 1
auto_select_device = true
test_device_on_startup = true

# System
[system]
volume_reduction_factor = 0.15
min_volume_percent = 5

# Transkription
[transcription]
language = "de"
whisper_model = "base"
compute_type = "float32"

# Rechtschreibkorrektur
[spell_check]
enabled = true
auto_correct = true

# Logging
[logging]
enabled = true
console_level = "INFO"
file_level = "DEBUG"
emoji_enabled = true
file_enabled = true
filename = "mauscribe.log"
suppress_external_logs = true

# Wörterbuch
[dictionary]
enabled = true
auto_add_unknown = false
path = ""
max_words = 1000

# Debug
[debug]
enabled = false
level = "INFO"
verbose = false

# Updates
[updates]
enabled = true
check_interval = 86400
check_on_startup = true
auto_install = false
include_prereleases = false

# Benachrichtigungen
[notifications]
enabled = true
duration = 5000
sound = true
toast = true
show_all = true

# Datenbank
[database]
enabled = true
data_directory = ""
audio_format = "wav"
auto_save_recordings = true
auto_save_transcriptions = true
mark_as_training_data = true
retention_days = 30
max_size_mb = 1000
compress_audio = false
backup_before_cleanup = true
