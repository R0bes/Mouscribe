<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1F3A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)" stroke="#3A4A6A" stroke-width="2"/>

  <!-- Microphone body -->
  <rect x="28" y="20" width="8" height="16" rx="4" fill="#00F0FF" filter="url(#glow)"/>

  <!-- Microphone stand -->
  <rect x="30" y="36" width="4" height="8" fill="#00F0FF" filter="url(#glow)"/>

  <!-- Microphone base -->
  <ellipse cx="32" cy="46" rx="6" ry="3" fill="#00F0FF" filter="url(#glow)"/>

  <!-- Sound waves -->
  <path d="M 20 32 Q 24 28 24 32 Q 24 36 20 32" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 44 32 Q 40 28 40 32 Q 40 36 44 32" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
