<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A1F3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A3A5A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D0DD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF0080;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGradient)" stroke="#3A4A6A" stroke-width="4"/>

  <!-- Microphone -->
  <rect x="108" y="80" width="40" height="64" rx="20" fill="url(#iconGradient)" filter="url(#glow)"/>

  <!-- Microphone stand -->
  <rect x="118" y="144" width="20" height="32" fill="url(#iconGradient)" filter="url(#glow)"/>

  <!-- Microphone base -->
  <ellipse cx="128" cy="184" rx="24" ry="12" fill="url(#iconGradient)" filter="url(#glow)"/>

  <!-- Mouse cursor -->
  <path d="M 180 100 L 200 120 L 190 130 L 180 120 Z" fill="#00F0FF" filter="url(#glow)"/>
  <rect x="182" y="102" width="8" height="12" fill="#00F0FF" filter="url(#glow)"/>

  <!-- M letter -->
  <path d="M 128 60 L 128 100 L 140 80 L 152 100 L 152 60" stroke="#00F0FF" stroke-width="6" fill="none" filter="url(#glow)"/>

  <!-- Sound waves -->
  <path d="M 80 128 Q 100 108 100 128 Q 100 148 80 128" stroke="#00F0FF" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M 176 128 Q 156 108 156 128 Q 156 148 176 128" stroke="#FF0080" stroke-width="4" fill="none" opacity="0.6"/>
</svg>
