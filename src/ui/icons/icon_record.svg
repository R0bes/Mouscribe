<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1F3A;stop-opacity:1" />
    </linearGradient>
    <animate id="pulse" attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)" stroke="#FF0080" stroke-width="2"/>

  <!-- Microphone body -->
  <rect x="28" y="20" width="8" height="16" rx="4" fill="#FF0080" filter="url(#glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Microphone stand -->
  <rect x="30" y="36" width="4" height="8" fill="#FF0080" filter="url(#glow)"/>

  <!-- Microphone base -->
  <ellipse cx="32" cy="46" rx="6" ry="3" fill="#FF0080" filter="url(#glow)"/>

  <!-- Recording indicator -->
  <circle cx="32" cy="32" r="2" fill="#FF0040" animate="pulse"/>

  <!-- Sound waves -->
  <path d="M 18 32 Q 22 26 22 32 Q 22 38 18 32" stroke="#FF0080" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 46 32 Q 42 26 42 32 Q 42 38 46 32" stroke="#FF0080" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 16 32 Q 20 24 20 32 Q 20 40 16 32" stroke="#FF0080" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 48 32 Q 44 24 44 32 Q 44 40 48 32" stroke="#FF0080" stroke-width="1.5" fill="none" opacity="0.6"/>
</svg>
