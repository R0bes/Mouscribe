name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install -e .

    - name: Build executable
      run: |
        # Stop any running instances
        taskkill /F /IM Mauscribe.exe 2>nul || echo "No running instances found"

        # Clean previous build
        if exist "build" rmdir /s /q build
        if exist "dist" rmdir /s /q dist

        # Build with PyInstaller
        pyinstaller mauscribe.spec --clean

    - name: Verify build
      run: |
        if exist "dist\Mauscribe.exe" (
          echo "✅ Build successful"
          for %%A in ("dist\Mauscribe.exe") do echo "Size: %%~zA bytes"
        ) else (
          echo "❌ Build failed"
          exit /b 1
        )

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: mauscribe-build-${{ github.ref_name }}
        path: |
          dist/Mauscribe.exe
          dist/data/
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        python tools/release_manager.py --tag ${{ github.ref_name }} --upload
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
