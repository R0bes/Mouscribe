name: CI/CD Pipeline

on:
  push:
    branches: [ main, v2-development, feature/* ]
  pull_request:
    branches: [ main, v2-development ]

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: [3.11, '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-ci.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install -e .

    - name: Run pre-commit hooks
      run: |
        python -m pre_commit run --all-files

    - name: Run linting
      run: |
        python -m black --check --diff src/ main.py
        python -m isort --check-only --diff src/ main.py
        python -m flake8 src/ main.py

    - name: Run type checking
      run: |
        python -m mypy src/ main.py --ignore-missing-imports

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          htmlcov/
          .coverage
          coverage.xml

  security:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        pip install -r requirements-ci.txt

    - name: Run security scan
      run: |
        python -m bandit -r src/ -f json -o bandit-report.json || true
        python -m safety check --json --output safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
