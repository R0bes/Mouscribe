# GitHub Actions CI/CD Workflow for Mauscribe
# Intelligente Pipeline für alle Branches und Pull Requests
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

# Workflow-Level Umgebungsvariablen für bessere Sichtbarkeit
env:
  COMMIT_SHA: ${{ github.sha }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  BRANCH_NAME: ${{ github.ref_name }}
  ACTOR: ${{ github.actor }}

jobs:
  # 🧪 Tests und Code-Qualität
  test:
    name: 🧪 Tests & Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: 🔍 Lint code
      run: |
        flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503
        black --check src/ tests/
        isort --check-only src/ tests/
        mypy src/ --ignore-missing-imports
        
    - name: 🧪 Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
        
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        
  # 🔒 Security Checks
  security:
    name: 🔒 Security Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install bandit safety
        
    - name: 🔒 Run security checks
      run: |
        bandit -r src/ -f json -o bandit-report.json
        safety check
        
  # 🔨 Build
  build:
    name: 🔨 Build Executables
    runs-on: ${{ matrix.os }}
    needs: [test, security]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 🔨 Build executable
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          pyinstaller --onefile --windowed --icon=assets/icons/mauscribe_icon.ico --name=mauscribe-win main.py
        elif [ "$RUNNER_OS" = "macOS" ]; then
          pyinstaller --onefile --windowed --icon=assets/icons/mauscribe_icon.icns --name=mauscribe-macos main.py
        else
          pyinstaller --onefile --icon=assets/icons/mauscribe_icon.svg --name=mauscribe-linux main.py
        fi
        
    - name: 📦 Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: mauscribe-${{ runner.os }}
        path: dist/
        
  # 🚀 Release
  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: [test, security, build]
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 📋 Generate release notes
      id: release_notes
      run: |
        # Extrahiere Version aus pyproject.toml
        VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
        # Generiere Release Notes aus CHANGELOG.md
        if [ -f "CHANGELOG.md" ]; then
          # Extrahiere den Inhalt für die aktuelle Version
          awk '/^## \['$VERSION'\]/,/^## \[/ {if (!/^## \[/ && !/^$/) print}' CHANGELOG.md > release_notes.txt
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi
        
    - name: 📦 Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.release_notes.outputs.version }}
        name: Release v${{ steps.release_notes.outputs.version }}
        body: |
          ## 🚀 Mauscribe v${{ steps.release_notes.outputs.version }}
          
          ${{ steps.release_notes.outputs.release_notes }}
          
          ### 📦 Downloads
          - **Windows**: `mauscribe-win.exe`
          - **Linux**: `mauscribe-linux`
          - **macOS**: `mauscribe-macos`
          
          ### 🔧 Installation
          1. Laden Sie die passende Datei für Ihr Betriebssystem herunter
          2. Machen Sie die Datei ausführbar (Linux/macOS): `chmod +x mauscribe-linux`
          3. Starten Sie Mauscribe: `./mauscribe-linux`
          
          ### 📋 Changelog
          Siehe [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) für Details.
        files: |
          dist/mauscribe-win.exe
          dist/mauscribe-linux
          dist/mauscribe-macos
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
  # 🔄 Deploy to PyPI (optional)
  deploy-pypi:
    name: 📦 Deploy to PyPI
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
        
    - name: 📦 Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: 🔨 Build package
      run: python -m build
      
    - name: 📦 Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip_existing: true
